services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: clave123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: node_server
    restart: always
    environment:
      DB_USERNAME: admin
      DB_PASSWORD: clave123
      DB_DATABASE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_DIALECT: postgres
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: react_client
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:

volumes:
  postgres_data:
